 stroke-dasharray="4 3"/><text x="334.0" y="439.0" font-size="13" fill="#6b655c" font-weight="400" text-anchor="start">unsigned</text><rect x="430.0" y="100.0" width="400.0" height="364.0" rx="14" fill="#f6f4ef" stroke="#d3cbbd" stroke-width="1.2"/><text x="816.0" y="126.0" font-size="15" fill="#6b655c" font-weight="600" text-anchor="end">Inside the model</text><rect x="450.0" y="160.0" width="170.0" height="84.0" rx="10" fill="#f8e6dd" stroke="#C8643F" stroke-width="1.4"/><text x="535.0" y="199.0" font-size="17" fill="#1c1a17" font-weight="600" text-anchor="middle">Verifier</text><text x="535.0" y="221.0" font-size="14" fill="#47433d" font-weight="400" text-anchor="middle">a verdict per block</text><rect x="450.0" y="320.0" width="170.0" height="84.0" rx="10" fill="#f8e6dd" stroke="#C8643F" stroke-width="1.4"/><text x="535.0" y="359.0" font-size="17" fill="#1c1a17" font-weight="600" text-anchor="middle">Policy checker</text><text x="535.0" y="381.0" font-size="14" fill="#47433d" font-weight="400" text-anchor="middle">what may be read or done</text><rect x="650.0" y="160.0" width="160.0" height="84.0" rx="10" fill="#e3eaf5" stroke="#3B6DB3" stroke-width="1.4"/><text x="730.0" y="199.0" font-size="17" fill="#1c1a17" font-weight="600" text-anchor="middle">Learned part</text><text x="730.0" y="221.0" font-size="14" fill="#47433d" font-weight="400" text-anchor="middle">chooses an action</text><rect x="650.0" y="320.0" width="160.0" height="84.0" rx="10" fill="#f8e6dd" stroke="#C8643F" stroke-width="1.4"/><text x="730.0" y="359.0" font-size="17" fill="#1c1a17" font-weight="600" text-anchor="middle">Output mask</text><text x="730.0" y="381.0" font-size="14" fill="#47433d" font-weight="400" text-anchor="middle">allowed actions only</text><line x1="392.0" y1="202.0" x2="446.0" y2="202.0" stroke="#6b655c" stroke-width="1.4" marker-end="url(#arrow)"/><text x="397.0" y="194.0" font-size="13" fill="#6b655c" font-weight="400" text-anchor="start">all</text><line x1="535.0" y1="24